name: oauth-demoapi-spring

services:
  idp:
    container_name: idp
    image: ghcr.io/identicum/keycloak:26.8
    restart: always
    pull_policy: always
    ports:
      - 127.0.0.1:8080:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/:/opt/keycloak/data/import/
    command: "start-dev --import-realm"

  demoapi:
    container_name: demoapi
    build: .
    restart: always
    ports:
      - 8081:8080
    environment:
      ISSUER_URI: http://idp:8080/realms/demorealm
    depends_on:
      idp:
        condition: service_healthy
